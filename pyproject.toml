[project]
name = "auto-cat-pipeline"
version = "0.1.0"
description = "Image dataset filtering pipeline with DINOv3 and Locate Anything adapters"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2",
    "pillow>=10.4.0",
    "pydantic-settings>=2.6.0",
    "scipy>=1.14.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
models = [
    "dghs-imgutils>=0.19.0",
    "huggingface-hub>=0.26.0",
    "onnxruntime>=1.21.0,<1.27",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.57.1,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

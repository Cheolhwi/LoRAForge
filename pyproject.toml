[project]
name = "auto-cat-pipeline"
version = "0.1.0"
description = "Image dataset filtering pipeline with DINOv3 and Locate Anything adapters"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2",
    "pillow>=10.4.0",
    "pydantic-settings>=2.6.0",
    "scipy>=1.14.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
models = [
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    "compressed-tensors>=0.9.0",
    "decord>=0.6.0",
    "dghs-imgutils[gpu]>=0.19.0",
    "huggingface-hub>=0.26.0",
    "lmdb>=1.7.0",
    "onnxruntime-gpu>=1.21.0,<1.27",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.2.0",
    "peft>=0.14.0",
    "timm>=1.0.0",
    "torch>=2.4.0",
    "torchvision>=0.26.0",
    "transformers>=4.57.1,<5",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
